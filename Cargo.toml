[workspace]
resolver = "3"
members = ["crates/rxui"]

[workspace.package]
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["hxyulin <hxyulin@proton.me>"]
repository = "https://github.com/hxyulin/rxui"

[workspace.dependencies]
astrelis = { git = "https://github.com/hxyulin/astrelis", rev = "829f6bedf6d743ad81d19c4ad6ce910d716ce3d5", version = "0.4.0-dev.0" }
astrelis-winit = { git = "https://github.com/hxyulin/astrelis", rev = "829f6bedf6d743ad81d19c4ad6ce910d716ce3d5", version = "0.4.0-dev.0" }
astrelis-native-drag = { git = "https://github.com/hxyulin/astrelis", rev = "829f6bedf6d743ad81d19c4ad6ce910d716ce3d5", version = "0.4.0-dev.0" }
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
profiling = { version = "1.0.18", default-features = false }

# Each test view type instantiates its own Ui<T>, and with full debug info one
# object file of the lib test binary outgrows Mach-O's 4 GiB relocation limit on
# macOS ("object file too large"). Line tables keep file:line in test panics
# and bring the largest object to about 2.7 GB.
[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
