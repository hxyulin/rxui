[workspace]
resolver = "3"
members = [
  "crates/astreon",
  "crates/astreon-app",
  "crates/astreon-devtools",
  "crates/astreon-editor",
  "crates/astreon-native-menu",
  "crates/astreon-testing",
  "crates/astreon-widgets",
]

[workspace.package]
version = "0.5.0"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hxyulin/astreon"
rust-version = "1.88"

[workspace.dependencies]
astreon-app = { path = "crates/astreon-app", version = "0.5.0" }
astreon-devtools = { path = "crates/astreon-devtools", version = "0.5.0" }
astreon-editor = { path = "crates/astreon-editor", version = "0.5.0" }
astreon-native-menu = { path = "crates/astreon-native-menu", version = "0.5.0" }
astreon-testing = { path = "crates/astreon-testing", version = "0.5.0" }
astreon-widgets = { path = "crates/astreon-widgets", version = "0.5.0" }

# Astrelis is pinned so clean clones and CI consume one reviewed engine state.
# Developers working in the sibling repository can copy
# `.cargo/config.toml.example` to `.cargo/config.toml` to use local paths.
astrelis-app = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-core = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-gpu-wgpu = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-paint = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-paint-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-platform = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-platform-test = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-platform-winit = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-profiling = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-text = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-ui = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-ui-core = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-ui-docking = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
astrelis-ui-widgets = { git = "https://github.com/hxyulin/astrelis", rev = "638a6d85b9147c6bae7f8b7929edcd2866365705" }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Retained layout runs on every interactive splitter movement. Keep Astreon
# crates debuggable while avoiding the large unoptimized Taffy/UI penalty in
# normal `cargo run` editor builds. `Ui<Message>` is generic, so its Taffy
# solve is monomorphized into downstream Astreon crates and needs the workspace
# dev level as well as dependency overrides.
[profile.dev]
opt-level = 1

[profile.dev.package.astrelis-ui-core]
opt-level = 2

[profile.dev.package.astrelis-ui-widgets]
opt-level = 2

[profile.dev.package.astrelis-ui-docking]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2
