[workspace]
resolver = "3"
members = [
  "crates/rxui",
  "crates/rxui-next",
  "crates/rxui-testing",
]

[workspace.package]
version = "0.1.0-rc.1"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hxyulin/rxui"
homepage = "https://github.com/hxyulin/rxui"
readme = "README.md"
rust-version = "1.88"
keywords = ["gui", "ui", "desktop", "editor", "wgpu"]
categories = ["gui", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
rxui-next = { path = "crates/rxui-next", version = "=0.1.0-rc.1" }
rxui-testing = { path = "crates/rxui-testing", version = "=0.1.0-rc.1" }

# Astrelis is pinned so clean clones and CI consume one reviewed engine state.
# Developers working in the sibling repository can copy
# `.cargo/config.toml.example` to `.cargo/config.toml` to use local paths.
astrelis-app = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-compositor = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-core = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-gpu-wgpu = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-paint = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-paint-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-platform = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-platform-test = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-platform-winit = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-profiling = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-render = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-render-3d = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-text = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-ui-core = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-ui-next = { path = "../astrelis/crates/astrelis-ui-next", version = "=0.3.0-rc.1" }
astrelis-ui-host = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
astrelis-ui-testing = { git = "https://github.com/hxyulin/astrelis", rev = "2e84a5e9748cd405beeff3ffd353e0d205b2de3a", version = "=0.3.0-rc.1" }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
wasm-bindgen = "=0.2.126"
web-sys = "=0.3.103"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Retained layout runs on every interactive splitter movement. Keep RXUI
# crates debuggable while avoiding the large unoptimized Taffy/UI penalty in
# normal `cargo run` editor builds. `Ui<Message>` is generic, so its Taffy
# solve is monomorphized into downstream RXUI crates and needs the workspace
# dev level as well as dependency overrides.
[profile.dev]
opt-level = 1

[profile.dev.package.taffy]
opt-level = 2
