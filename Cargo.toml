[workspace]
resolver = "3"
members = [
  "crates/rxui",
  "crates/rxui-charts",
  "crates/rxui-controls",
  "crates/rxui-core",
  "crates/rxui-native",
  "crates/rxui-testing",
  "crates/rxui-widgets",
]

[workspace.package]
version = "0.1.0-rc.1"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hxyulin/rxui"
homepage = "https://github.com/hxyulin/rxui"
readme = "README.md"
rust-version = "1.88"
keywords = ["gui", "ui", "desktop", "editor", "wgpu"]
categories = ["gui", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
rxui-charts = { path = "crates/rxui-charts", version = "=0.1.0-rc.1" }
rxui-controls = { path = "crates/rxui-controls", version = "=0.1.0-rc.1" }
rxui-core = { path = "crates/rxui-core", version = "=0.1.0-rc.1" }
rxui-native = { path = "crates/rxui-native", version = "=0.1.0-rc.1" }
rxui-testing = { path = "crates/rxui-testing", version = "=0.1.0-rc.1" }
rxui-widgets = { path = "crates/rxui-widgets", version = "=0.1.0-rc.1" }

# The component engine is under joint development in the sibling Astrelis
# checkout and is not published yet. Pin these paths until that release gate.
astrelis-app = { path = "../astrelis/crates/astrelis-app", version = "=0.3.0-rc.1" }
astrelis-compositor = { path = "../astrelis/crates/astrelis-compositor", version = "=0.3.0-rc.1" }
astrelis-core = { path = "../astrelis/crates/astrelis-core", version = "=0.3.0-rc.1" }
astrelis-gpu = { path = "../astrelis/crates/astrelis-gpu", version = "=0.3.0-rc.1" }
astrelis-paint = { path = "../astrelis/crates/astrelis-paint", version = "=0.3.0-rc.1" }
astrelis-paint-gpu = { path = "../astrelis/crates/astrelis-paint-gpu", version = "=0.3.0-rc.1" }
astrelis-platform = { path = "../astrelis/crates/astrelis-platform", version = "=0.3.0-rc.1" }
astrelis-platform-winit = { path = "../astrelis/crates/astrelis-platform-winit", version = "=0.3.0-rc.1" }
astrelis-text = { path = "../astrelis/crates/astrelis-text", version = "=0.3.0-rc.1" }
astrelis-ui-core = { path = "../astrelis/crates/astrelis-ui-core", version = "=0.3.0-rc.1" }
astrelis-ui-next = { path = "../astrelis/crates/astrelis-ui-next", version = "=0.3.0-rc.1" }
astrelis-ui-host = { path = "../astrelis/crates/astrelis-ui-host", version = "=0.3.0-rc.1" }
astrelis-ui-testing = { path = "../astrelis/crates/astrelis-ui-testing", version = "=0.3.0-rc.1" }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
wasm-bindgen = "=0.2.126"
web-sys = "=0.3.103"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Retained layout runs on every interactive splitter movement. Keep RXUI
# crates debuggable while avoiding the large unoptimized Taffy/UI penalty in
# normal `cargo run` editor builds. `Ui<Message>` is generic, so its Taffy
# solve is monomorphized into downstream RXUI crates and needs the workspace
# dev level as well as dependency overrides.
[profile.dev]
opt-level = 1

[profile.dev.package.taffy]
opt-level = 2
