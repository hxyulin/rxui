[workspace]
resolver = "3"
members = ["crates/rxui"]

[workspace.package]
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["hxyulin <hxyulin@proton.me>"]
repository = "https://github.com/hxyulin/rxui"

[workspace.dependencies]
astrelis = { git = "https://github.com/hxyulin/astrelis", rev = "d8ac1d1b5fd0c57d5ae0811abb3a004f6e3f6923", version = "0.4.0-dev.0" }
astrelis-winit = { git = "https://github.com/hxyulin/astrelis", rev = "d8ac1d1b5fd0c57d5ae0811abb3a004f6e3f6923", version = "0.4.0-dev.0" }
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
profiling = { version = "1.0.18", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
