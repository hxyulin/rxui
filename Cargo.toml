[workspace]
resolver = "3"
members = [
  "crates/rxui",
  "crates/rxui-charts",
  "crates/rxui-controls",
  "crates/rxui-core",
  "crates/rxui-native",
  "crates/rxui-test-support",
  "crates/rxui-widgets",
]

[workspace.package]
version = "0.1.0-rc.1"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hxyulin/rxui"
homepage = "https://github.com/hxyulin/rxui"
readme = "README.md"
rust-version = "1.88"
keywords = ["gui", "ui", "desktop", "editor", "wgpu"]
categories = ["gui", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
rxui-charts = { path = "crates/rxui-charts", version = "=0.1.0-rc.1" }
rxui-controls = { path = "crates/rxui-controls", version = "=0.1.0-rc.1" }
rxui-core = { path = "crates/rxui-core", version = "=0.1.0-rc.1" }
rxui-native = { path = "crates/rxui-native", version = "=0.1.0-rc.1" }
rxui-widgets = { path = "crates/rxui-widgets", version = "=0.1.0-rc.1" }
# Unpublished, so deliberately carries no `version`: cargo strips path-only
# dev-dependencies when packaging.
rxui-test-support = { path = "crates/rxui-test-support" }

# The component engine is under joint development in the sibling Astrelis
# checkout and is not published yet. Pin an exact revision so CI and every
# developer resolve the same tree; work against a local sibling checkout by
# copying `.cargo/config.toml.example` to `.cargo/config.toml`, which patches
# every crate below to `../astrelis`.
#
# `cargo publish` rejects git dependencies. That is not a regression: publishing
# is separately blocked by `astrelis-ui-next`'s `publish = false`. Swap these
# for plain `version` requirements when Astrelis publishes. See RELEASING.md.
astrelis-app = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-compositor = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-core = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-paint = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-paint-gpu = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-platform = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-platform-winit = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-text = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-ui-next = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
astrelis-ui-host = { git = "https://github.com/hxyulin/astrelis", rev = "39ea10f602b825b302433dff5fad1796c0de4727", version = "=0.3.0-rc.1" }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
wasm-bindgen = "=0.2.126"
web-sys = "=0.3.103"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Retained layout runs on every interactive splitter movement. Keep RXUI
# crates debuggable while avoiding the large unoptimized Taffy/UI penalty in
# normal `cargo run` editor builds. `Ui<Message>` is generic, so its Taffy
# solve is monomorphized into downstream RXUI crates and needs the workspace
# dev level as well as dependency overrides.
[profile.dev]
opt-level = 1

[profile.dev.package.taffy]
opt-level = 2
