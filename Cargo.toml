[workspace]
resolver = "3"
members = ["crates/rxui", "crates/rxui-draw", "crates/rxui-host", "crates/rxui-native-drag"]
default-members = ["crates/rxui"]

[workspace.package]
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["hxyulin <hxyulin@proton.me>"]
repository = "https://github.com/hxyulin/rxui"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "webgpu"] }
winit = "0.30.13"
rxui-draw = { path = "crates/rxui-draw" }
rxui-host = { path = "crates/rxui-host" }
rxui-native-drag = { path = "crates/rxui-native-drag" }
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
profiling = { version = "1.0.18", default-features = false }

# Each test view type instantiates its own Ui<T>, and with full debug info one
# object file of the lib test binary outgrows Mach-O's 4 GiB relocation limit on
# macOS ("object file too large"). Line tables keep file:line in test panics
# and bring the largest object to about 2.7 GB.
[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
