# Git hooks run by prek (https://prek.j178.dev). Install them with `prek install`.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

# Benchmark inputs and output, and third-party license texts are kept byte for byte.
exclude = '^(docs/performance/.*\.(csv|log|rs)|crates/rxui/tests/fonts/.*-OFL\.md)$'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos" }]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all --", language = "system", types = ["rust"] },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets -- -D warnings", language = "system", types = ["rust"], pass_filenames = false, stages = ["pre-push"] },
]
