[package]
name = "rxui-host"
description = "Native window, GPU, and event-loop hosting for RXUI entities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["winit"]
winit = ["dep:astrelis-platform-winit"]

[dependencies]
astrelis-app = { workspace = true }
astrelis-compositor = { workspace = true }
astrelis-core = { workspace = true }
astrelis-gpu = { workspace = true }
astrelis-gpu-wgpu = { workspace = true }
astrelis-paint = { workspace = true }
astrelis-paint-gpu = { workspace = true }
astrelis-platform = { workspace = true }
astrelis-platform-winit = { workspace = true, optional = true }
astrelis-text = { workspace = true }
pollster = { workspace = true }
rxui-core = { path = "../rxui-core" }
rxui-tree = { workspace = true }

[[example]]
name = "native_counter"
required-features = ["winit"]

[[example]]
name = "native_settings"
required-features = ["winit"]

[[example]]
name = "native_workbench"
required-features = ["winit"]

[lints]
workspace = true
