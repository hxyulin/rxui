[package]
name = "rxui-draw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
gles = ["wgpu/gles"]

[dependencies]
log = "0.4.34"
bytemuck = { version = "1.25.2", features = ["derive"] }
profiling.workspace = true
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
bymsdfgen-core = { version = "0.1.1", default-features = false }
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
lyon_tessellation = "1.0.23"
unicode-segmentation = "1.13.3"
wgpu.workspace = true

[dev-dependencies]
pollster = "1.0.1"
winit.workspace = true

[lints]
workspace = true
