[package]
name = "rxui-native"
description = "Native window and runtime integration for RXUI components"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `ComponentWindow::open` needs only an `AppContext`, so embedding RXUI in an
# event loop you already own does not need winit. Without this feature it was
# linked unconditionally as a bare `cfg(not(wasm32))` target dependency.
default = ["winit"]
winit = ["dep:astrelis-platform-winit"]

[dependencies]
rxui-core = { workspace = true }
astrelis-app = { workspace = true }
astrelis-compositor = { workspace = true }
astrelis-core = { workspace = true }
astrelis-gpu = { workspace = true }
astrelis-paint = { workspace = true }
astrelis-paint-gpu = { workspace = true }
astrelis-platform = { workspace = true }
astrelis-ui-host = { workspace = true }
astrelis-ui-next = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
astrelis-platform-winit = { workspace = true, optional = true }

[lints]
workspace = true
