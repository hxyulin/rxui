[package]
name = "rxui-widgets"
description = "Optional charts, node graphs, docking, and devtools for RXUI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Every surface here is one an application can do without, which is the reason
# this crate exists separately from `rxui-core`. `devtools` is off by default
# because a shipped application has no reason to carry its own tree inspector.
default = ["charts", "docking", "graph"]
charts = []
docking = []
graph = []
devtools = []

[dependencies]
rxui-core = { workspace = true }
astrelis-core = { workspace = true }
astrelis-paint = { workspace = true }
astrelis-platform = { workspace = true }
astrelis-text = { workspace = true }
astrelis-ui-next = { workspace = true }

[lints]
workspace = true
