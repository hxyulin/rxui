[package]
name = "astreon"
description = "Batteries-included retained-mode desktop UI framework"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["editor"]
devtools = ["dep:astreon-devtools"]
editor = ["dep:astreon-editor"]
testing = ["dep:astreon-testing"]

[dependencies]
astreon-app = { workspace = true }
astreon-devtools = { workspace = true, optional = true }
astreon-editor = { workspace = true, optional = true }
astreon-native-menu = { workspace = true }
astreon-testing = { workspace = true, optional = true }
astreon-widgets = { workspace = true }
astrelis-ui = { workspace = true }

[dev-dependencies]
astrelis-app = { workspace = true }
astrelis-compositor = { workspace = true }
astrelis-core = { workspace = true }
astrelis-gpu = { workspace = true }
astrelis-paint = { workspace = true }
astrelis-platform = { workspace = true }
astrelis-platform-winit = { workspace = true }
astrelis-profiling = { workspace = true }
astrelis-render = { workspace = true }
astrelis-render-3d = { workspace = true }
astrelis-text = { workspace = true }
astrelis-ui-core = { workspace = true }
astrelis-ui-testing = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true

[[example]]
name = "devtools_inspector"
required-features = ["devtools"]
