[package]
name = "rxui"
description = "Declarative UI state and component runtime over Astrelis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["layout"]
gles = ["rendering", "astrelis/gles", "astrelis-winit?/gles"]
rendering = ["layout", "dep:astrelis"]
native = ["accessibility", "dep:accesskit_winit", "rendering", "tasks", "dep:astrelis-winit", "dep:arboard", "dep:objc2-app-kit", "dep:windows-registry", "dep:zbus"]
native-dialogs = ["native", "dep:rfd"]
desktop-services = ["native", "dep:opener"]
native-menus = ["native", "dep:muda", "dep:windows-sys"]
image-decoding = ["layout", "dep:image_codec"]
accessibility = ["layout", "dep:accesskit"]
layout = ["dep:taffy", "dep:unicode-segmentation"]
tasks = ["dep:async-executor", "dep:async-channel", "dep:futures-lite", "dep:futures-util", "dep:async-io"]

[dependencies]
profiling.workspace = true
image_codec = { package = "image", version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
astrelis = { workspace = true, optional = true }
astrelis-winit = { workspace = true, optional = true }
accesskit = { version = "0.25.1", optional = true }
accesskit_winit = { version = "0.34.1", optional = true }
taffy = { workspace = true, optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
async-executor = { version = "1.14.0", optional = true }
async-channel = { version = "2.5.0", optional = true }
futures-lite = { version = "2.6.1", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"], optional = true }
arboard = { version = "3.7.0", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = { version = "2.6.0", optional = true }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"], optional = true }
opener = { version = "0.9.0", features = ["reveal"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"], optional = true }

# System appearance detection for `native`; see docs/native-feel.md. The macOS and
# Linux crates are already in the native dependency graph (arboard, AccessKit).
# AppKit accessibility flags and the accent color through safe objc2 bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSColor", "NSColorSpace", "NSWorkspace", "objc2-core-foundation"], optional = true }

# Microsoft's safe registry wrapper: high contrast, accent and animation settings.
[target.'cfg(target_os = "windows")'.dependencies.windows-registry]
version = "0.100.0"
optional = true

# XDG desktop portal Settings over the session bus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "6.0.0", default-features = false, features = ["default-rt", "proxy"], optional = true }

[dev-dependencies]
pollster = "1.0.1"
accesskit_consumer = "0.39.1"

# Muda's Win32 attachment/message APIs require three narrowly scoped unsafe
# operations in native/menu_backend/windows.rs. All other RXUI code denies unsafe.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = "warn"

