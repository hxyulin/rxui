[package]
name = "draglet"
description = "Thread-bound native mouse capture and cross-window drag targeting for winit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/rxui"
readme = "README.md"
keywords = ["drag", "winit", "wayland", "x11", "desktop"]
categories = ["gui"]
include = ["src/**", "examples/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[features]
default = ["appkit", "win32", "x11", "wayland"]
appkit = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:block2"]
win32 = ["dep:windows-sys"]
x11 = ["dep:x11rb", "dep:log"]
wayland = ["dep:wayland-client", "dep:wayland-backend"]

[dependencies]
x11rb = { version = "0.13.2", optional = true, features = ["shape", "xtest"] }
log = { version = "0.4.34", optional = true }

winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSEnumerator", "NSObject", "NSGeometry"] }
block2 = { version = "0.6.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[target.'cfg(unix)'.dependencies]
wayland-client = { version = "0.31.15", optional = true }
wayland-backend = { version = "0.3.17", optional = true, features = ["client_system", "dlopen"] }

[dev-dependencies]
softbuffer = "0.4.8"

[[example]]
name = "wayland_drag"
required-features = ["wayland"]

[[example]]
name = "x11_drag"
required-features = ["x11"]
