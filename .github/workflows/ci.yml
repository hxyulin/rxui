name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full all-features debug info can exceed 32-bit DWARF offsets on Linux.
  # Keep debug artifacts bounded for the desktop and feature matrices too.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  hooks:
    timeout-minutes: 30
    name: Formatting, typos and file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - uses: j178/prek-action@v3.1.0

  test:
    timeout-minutes: 30
    name: Linux quality and workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated X11 test server
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Draglet and host X11 protocol tests
        run: |
          # DISPLAY must expand in xvfb-run's child shell, after it selects a display.
          # shellcheck disable=SC2016
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' sh -c \
            'DRAGLET_X11_TEST_DISPLAY="$DISPLAY" cargo test -p draglet -p rxui-host --all-features --locked x11::tests -- --ignored --test-threads=1'
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify standalone draglet package
        run: cargo package -p draglet --locked

  platforms:
    timeout-minutes: 30
    name: All features (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Bound Windows test linking memory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The large generic test harness exhausted link.exe's memory (LNK1102).
          # Use Rust's bundled LLD and omit test PDBs; keep every test enabled.
          "RUSTFLAGS=-C linker=rust-lld" >> $env:GITHUB_ENV
          "CARGO_PROFILE_TEST_DEBUG=0" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=2" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - run: cargo check --workspace --all-targets --all-features --locked

  features:
    timeout-minutes: 30
    name: RXUI feature subset (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [layout, accessibility, tasks, image-decoding, rendering]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: rxui-${{ matrix.features }}
      - run: cargo test -p rxui --no-default-features --features ${{ matrix.features }} --locked
      - run: cargo check -p rxui --all-targets --no-default-features --features ${{ matrix.features }} --locked

  msrv:
    timeout-minutes: 30
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
